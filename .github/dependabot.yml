# Dependabot: weekly dependency + GitHub Actions updates across the three
# manifest roots — the monorepo root npm workspace, the dashboard's separate
# npm app (own package.json + package-lock.json), and the action pins in
# .github/workflows. NOTE (issue #127): GitHub Actions is currently
# billing-locked, so Dependabot PRs will queue up but their CI checks stay
# pending until Actions runs are re-enabled. For the same reason, MAJOR
# version bumps are ignored below: a major action/toolchain bump can silently
# change workflow behavior and there is no pipeline to catch it. Remove the
# ignore blocks as part of unlocking CI (issue #127).
version: 2
updates:
  # Root monorepo: workspace devDependencies + toolchain.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Dashboard is its own npm app with its own lockfile.
  - package-ecosystem: npm
    directory: "/dashboard"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major

  # Keep the actions/*, dtolnay/* and Swatinem/* pins fresh.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
