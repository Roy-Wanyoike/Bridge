name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default: every job only gets read access unless it
# explicitly elevates (none of these need to).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Check docs facts (stale counts / dropped canonical facts fail the build)
        run: node scripts/check-docs-facts.mjs

      - name: Test
        run: npm test

  go-generator-verify:
    name: Verify generated Go code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: npm ci
      - run: npm run build
      - name: Generate + vet + test Go output
        run: bash scripts/verify-go.sh

  rust-generator-verify:
    name: Verify generated Rust code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Generate + check + test Rust output
        run: bash scripts/verify-rust.sh

  java-generator-verify:
    name: Verify generated Java code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm run build
      - name: Generate + javac compile + round-trip Java output
        run: bash scripts/verify-java.sh

  csharp-generator-verify:
    name: Verify generated C# code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - run: npm ci
      - run: npm run build
      - name: Generate + dotnet build + round-trip C# output
        run: bash scripts/verify-csharp.sh

  dashboard:
    name: Dashboard (lint + typecheck + build + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  registry-service-postgres:
    name: Registry service (PostgreSQL integration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bridge
          POSTGRES_USER: bridge
          POSTGRES_PASSWORD: bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bridge -d bridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_DSN: postgres://bridge:bridge@localhost:5432/bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test registry service (exercises the postgres driver via PG_DSN)
        run: npm test --workspace @bridge/registry-service

  serialization-matrix:
    name: Cross-language serialization matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-serialization.txt
      - name: Install Python codecs
        run: pip install -r scripts/requirements-serialization.txt
      - run: npm ci
      - run: npm run build
      - name: Run the 4-language golden-vector matrix
        run: bash scripts/verify-serialization.sh
