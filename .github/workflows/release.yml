name: Release

# Triggered by pushing a semver tag (v<major>.<minor>.<patch>):
#   1. guard       — asserts version lockstep (tag == root package.json == every
#                    workspace package == the CLI's CLI_VERSION == Homebrew
#                    formula); fails on drift; also fails while the Homebrew
#                    formula still carries a `sha256 :no_check` placeholder
#   2. binaries    — builds self-contained CLI binaries for 5 platform targets,
#                    smoke-tests the native ones honestly (no `|| true`)
#   3. checksums   — SHA-256 checksums, SPDX SBOM, keyless blob signing + SBOM
#                    attestation of the checksums file
#   4. gh-release  — GitHub release with a conventional-commit changelog
#   5. container   — per-platform builds pushed by digest, merged into a TRUE
#                    multi-arch manifest list (X.Y.Z, vX.Y.Z, latest), verified
#                    with `docker buildx imagetools inspect`, signed by digest
#   6. npm         — publishes the npm workspaces (dry-run + loud warning when
#                    NPM_TOKEN is absent; hard failure on real publish errors)
#
# Prerequisites (one-time, repo settings): allow OIDC for cosign keyless
# signing; set NPM_TOKEN secret for the publish job (without it the npm job
# runs a dry-run and publishes nothing).

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write # cosign keyless signing + SBOM attestation

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  guard:
    name: Version guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assert tag/version lockstep
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag '${TAG}' is not of the form vX.Y.Z"
            exit 1
          fi
          VERSION="${TAG#v}"
          fail=0

          root_version="$(node -p "require('./package.json').version")"
          if [ "$root_version" != "$VERSION" ]; then
            echo "::error::Root package.json version is ${root_version}, but the tag is ${VERSION}. Unify versions (RELEASE.md checklist) before tagging."
            fail=1
          fi

          for f in packages/*/package.json; do
            v="$(node -p "require('./$f').version")"
            if [ "$v" != "$VERSION" ]; then
              echo "::error::$f version is ${v}, but the tag is ${VERSION}. Unify versions (RELEASE.md checklist) before tagging."
              fail=1
            fi
          done

          formula_version="$(sed -n 's/^[[:space:]]*version[[:space:]]*"\([^"]*\)".*/\1/p' homebrew/bridge.rb)"
          if [ "$formula_version" != "$VERSION" ]; then
            echo "::error::homebrew/bridge.rb version is ${formula_version:-<unset>}, but the tag is ${VERSION}. Bump the formula as part of the release checklist (RELEASE.md)."
            fail=1
          fi

          # Same CLI_VERSION check scripts/release-rehearsal.sh performs: the
          # binaries print this constant as their version, so it must match
          # the tag too. `|| true` keeps a missing line from killing the step
          # via `set -e` — the empty value fails the comparison below instead.
          cli_version="$(grep -o "CLI_VERSION = '[^']*'" packages/bridge-cli/src/meta.ts | cut -d"'" -f2 || true)"
          if [ "$cli_version" != "$VERSION" ]; then
            echo "::error::packages/bridge-cli/src/meta.ts CLI_VERSION is ${cli_version:-<unset>}, but the tag is ${VERSION}. Bump CLI_VERSION as part of the release checklist (RELEASE.md) before tagging."
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Version drift detected — release aborted, see the ::error:: lines above."
          fi
          exit "$fail"

      # `sha256 :no_check` makes brew install unverified binaries. The
      # formula only ships once the release checklist has pinned the real
      # per-target digests (from the release's checksums-sha256.txt), so
      # refuse to run the release while any placeholder remains.
      - name: Refuse to ship a formula with sha256 :no_check
        run: |
          if grep -n 'sha256[[:space:]]*:no_check' homebrew/bridge.rb; then
            echo "::error::homebrew/bridge.rb still contains 'sha256 :no_check' — pin the real per-target digests from the release's checksums-sha256.txt (RELEASE.md checklist step 3) before tagging."
            exit 1
          fi

  binaries:
    name: Binaries (${{ matrix.os-label }})
    needs: guard
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runs-on: ubuntu-latest, os-label: linux-amd64, target: bun-linux-x64, ext: "" }
          - { runs-on: ubuntu-latest, os-label: linux-arm64, target: bun-linux-arm64, ext: "" }
          - { runs-on: macos-latest, os-label: darwin-amd64, target: bun-darwin-x64, ext: "" }
          - { runs-on: macos-latest, os-label: darwin-arm64, target: bun-darwin-arm64, ext: "" }
          - { runs-on: ubuntu-latest, os-label: windows-amd64, target: bun-windows-x64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4

      # Pinned so release binaries are reproducible (no other bun version
      # reference existed in the repo to stay in sync with — bump here
      # deliberately, together with scripts/package-release.mjs consumers).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install + build workspace
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Build binary
        run: |
          mkdir -p dist/release
          VERSION="${GITHUB_REF_NAME#v}"
          bun build --compile --minify \
            --target=${{ matrix.target }} \
            packages/bridge-cli/src/bin/bridge.ts \
            --outfile "dist/release/bridge-v${VERSION}-${{ matrix.os-label }}${{ matrix.ext }}"

      # Honest smoke test: invoke the built binary directly via glob (the
      # artifact name is deterministic: bridge-v<version>-<os-label><ext>).
      # The old condition compared os-label against the literal string
      # 'darwin-*' (no glob expansion in GHA expressions — a no-op) and
      # masked every failure with `|| true`.
      # Exclusions: darwin via runner.os (per release design); linux-arm64
      # because no arm64 runner exists to execute the cross-compiled binary;
      # windows-amd64 explicitly, because it is CROSS-COMPILED on an ubuntu
      # runner (see matrix runs-on), so `runner.os != 'Windows'` alone would
      # not exclude it — running a PE on Linux must not fail the release.
      - name: Smoke test the binary
        if: runner.os != 'Windows' && runner.os != 'macOS' && matrix.os-label != 'linux-arm64' && matrix.os-label != 'windows-amd64'
        run: dist/release/bridge-v*-${{ matrix.os-label }}${{ matrix.ext }} version

      - uses: actions/upload-artifact@v4
        with:
          name: bridge-${{ matrix.os-label }}
          path: dist/release/
          if-no-files-found: error

  checksums-sbom-sign:
    name: Checksums, SBOM, signing
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist/release
        run: |
          sha256sum bridge-* > checksums-sha256.txt
          cat checksums-sha256.txt

      - name: SPDX SBOM for the release artifacts
        uses: anchore/sbom-action@v0
        with:
          path: dist/release
          format: spdx-json
          output-file: dist/release/bridge-sbom.spdx.json
          artifact-name: bridge-sbom.spdx.json
          # Uploaded below via the `release-meta` artifact (the file is needed
          # locally as the attestation predicate).
          upload-artifact: false
          upload-release-assets: false

      - name: CycloneDX SBOM for the release artifacts
        uses: anchore/sbom-action@v0
        with:
          path: dist/release
          format: cyclonedx-json
          artifact-name: bridge-sbom.cyclonedx.json

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign binaries + checksums (keyless)
        run: |
          for file in dist/release/bridge-* dist/release/checksums-sha256.txt; do
            cosign sign-blob --yes --output-signature "${file}.sig" "$file"
          done

      # The SBOM covers the whole artifact directory (not per-binary), so we
      # attest the checksums file — the release's root of trust — with the
      # SPDX document as predicate. `--type spdxjson` (predicateType
      # https://spdx.dev/Document) is the cosign-validated shape for an SPDX
      # document; `--type slsaprovenance` would fail cosign's predicate
      # validation (verified locally against cosign v2: it requires a
      # `builder` field an SBOM does not carry).
      - name: Attest the checksums file with the SPDX SBOM (keyless)
        run: |
          cosign attest-blob --yes \
            --predicate dist/release/bridge-sbom.spdx.json \
            --type spdxjson \
            --output-attestation dist/release/checksums-sha256.txt.att \
            dist/release/checksums-sha256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: release-meta
          path: |
            dist/release/checksums-sha256.txt
            dist/release/*.sig
            dist/release/bridge-sbom.spdx.json
            dist/release/checksums-sha256.txt.att

  github-release:
    name: GitHub release
    needs: checksums-sbom-sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist/release
          merge-multiple: true

      # No continue-on-error: a cliff.toml/template failure must fail the
      # release, not silently degrade the body. The `|| fallback` on the body
      # only covers an EMPTY changelog (e.g. the first release, no previous
      # tag to diff against).
      - name: Changelog from conventional commits
        id: changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header

      - uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content || 'See commit history for changes.' }}
          files: |
            dist/release/bridge-v*
            dist/release/checksums-sha256.txt
            dist/release/*.sig
            dist/release/checksums-sha256.txt.att
            dist/release/bridge-sbom.*.json

  container-build:
    name: Container build (${{ matrix.platform }})
    needs: guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - uses: actions/checkout@v4

      # ghcr.io requires lowercase image names; `${{ github.repository }}`
      # keeps the repo's display case (metadata-action used to lowercase it
      # implicitly — with explicit `outputs:` we must do it ourselves).
      - name: Prepare
        run: |
          platform="${{ matrix.platform }}"
          echo "PLATFORM_PAIR=${platform//\//-}" >> "$GITHUB_ENV"
          echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  container-merge:
    name: Container manifest (multi-arch)
    needs: container-build
    runs-on: ubuntu-latest
    steps:
      - name: Prepare
        run: echo "IMAGE=${REGISTRY}/${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Single writer, sequential: assemble the manifest list from the
      # per-platform digests exported by container-build. Tags emitted:
      #   <X.Y.Z>, v<X.Y.Z>, latest
      - name: Create the multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:${GITHUB_REF_NAME#v}" \
            -t "$IMAGE:v${GITHUB_REF_NAME#v}" \
            -t "$IMAGE:latest" \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify both platforms are present in the manifest list
        run: |
          IMAGE_TAG="$IMAGE:v${GITHUB_REF_NAME#v}"
          docker buildx imagetools inspect "$IMAGE_TAG" | tee "${RUNNER_TEMP}/inspect.txt"
          for plat in linux/amd64 linux/arm64; do
            grep -Eq "Platform:[[:space:]]+${plat}" "${RUNNER_TEMP}/inspect.txt" || {
              echo "::error::${plat} missing from ${IMAGE_TAG} manifest list"
              exit 1
            }
          done
          echo "Multi-arch manifest verified: ${IMAGE_TAG} (linux/amd64 + linux/arm64)"

      # Sign the immutable digest, never a mutable tag: the manifest list we
      # just created is assembled from the exported per-platform digests, and
      # its index digest is resolved immediately after creation (single merge
      # job — no sibling-writer race). `cosign verify …:<tag>` then resolves
      # to this digest and finds the signature.
      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the manifest digest (keyless)
        run: |
          IMAGE_TAG="$IMAGE:v${GITHUB_REF_NAME#v}"
          DIGEST="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "Signing ${IMAGE}@${DIGEST}"
          cosign sign --yes "${IMAGE}@${DIGEST}"

  npm:
    name: Publish npm workspaces
    needs: github-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - run: npm run build

      # Single source of truth for what gets published: every workspace
      # package whose manifest is not `private: true` (directory names under
      # packages/). Both the dist/ check and the publish loop below consume
      # this list, so a newly non-private package is picked up and a
      # privatised one drops out automatically — no hardcoded names to drift.
      - name: Derive the publish list from the workspace manifests
        id: publish-list
        run: |
          list=""
          for f in packages/*/package.json; do
            if [ "$(node -p "require('./$f').private === true")" = "true" ]; then
              echo "skipping private package: $f"
              continue
            fi
            list="$list $(basename "$(dirname "$f")")"
          done
          list="${list# }"
          if [ -z "$list" ]; then
            echo "::error::No publishable packages found under packages/*/package.json"
            exit 1
          fi
          echo "packages=$list" >> "$GITHUB_OUTPUT"
          echo "Publish list: $list"

      # Root build script completeness is fixed via PR #54; this assertion is
      # the guard that refuses to ship empty tarballs regardless.
      - name: Verify every published package has a dist/
        run: |
          fail=0
          for pkg in ${{ steps.publish-list.outputs.packages }}; do
            if [ ! -d "packages/$pkg/dist" ]; then
              echo "::error::packages/$pkg/dist is missing after 'npm run build' — refusing to publish an empty tarball."
              fail=1
            fi
          done
          exit "$fail"

      - name: Publish @bridge/* (public)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          DRY_RUN=""
          if [ -z "${NODE_AUTH_TOKEN:-}" ]; then
            echo "::warning title=NPM_TOKEN is empty::Running 'npm publish --dry-run' ONLY — nothing will be published to npm. Set the NPM_TOKEN secret to publish for real."
            DRY_RUN="--dry-run"
          else
            # Preflight: fail loudly on a missing/expired/unauthorized token.
            npm whoami
          fi
          for pkg in ${{ steps.publish-list.outputs.packages }}; do
            echo "== npm publish: packages/$pkg ${DRY_RUN}"
            (cd "packages/$pkg" && npm publish --access public $DRY_RUN)
          done
