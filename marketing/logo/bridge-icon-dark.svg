<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Bridge logo">
  
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4A8"/>
      <stop offset="100%" stop-color="#6380E0"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="46%" r="55%">
