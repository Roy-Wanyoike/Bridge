      <stop offset="0%" stop-color="#101736"/>
      <stop offset="100%" stop-color="#0B1026"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>
  <g transform="translate(0.00,0.00) scale(1.000000)">
      <line x1="78" y1="372" x2="434" y2="372" stroke="url(#bgUS)" stroke-width="30" stroke-linecap="round"/>
      <line x1="150" y1="428" x2="248" y2="428" stroke="#26315C" stroke-width="12" stroke-linecap="round"/>
