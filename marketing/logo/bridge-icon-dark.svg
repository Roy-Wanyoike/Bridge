    <linearGradient id="bgUS" gradientUnits="userSpaceOnUse" x1="78" y1="0" x2="434" y2="0">
      <stop offset="0%" stop-color="#2DD4A8"/>
      <stop offset="100%" stop-color="#6380E0"/>
    </linearGradient>
